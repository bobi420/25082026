<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Receipt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin:0; background:#dedede; font-family:"Courier New", Courier, monospace; }
        .wrapper { max-width:390px; margin:20px auto; padding:0 10px; }
        .receipt { background:#f9f9f9; padding:22px 18px 18px; box-shadow:0 3px 12px rgba(0,0,0,.25); }
        .logo { text-align:center; margin-bottom:8px; }
        .logo svg { width:42px; height:auto; fill:#000; }
        .center { text-align:center; }
        .small { font-size:14px; line-height:1.55; }
        .bold { font-weight:700; }
        .big { font-size:20px; font-weight:700; }
        .divider { border-top:1px dashed #aaa; margin:14px 0; }
        .row { display:flex; justify-content:space-between; font-size:15px; margin:6px 0; }
        .item { margin:10px 0 6px; font-size:15px; }
        .barcode { margin-top:18px; height:44px; background: repeating-linear-gradient(90deg, #000 0, #000 3px, transparent 3px, transparent 6px); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="receipt">
        <div class="logo">
            <svg viewBox="0 0 305 376" xmlns="http://www.w3.org/2000/svg">
                <path d="M255.6 200.4c-1.1-39.3 32.1-58 33.6-58.9-18.3-26.7-46.8-30.4-56.9-30.8-24.2-2.5-47.3 14.3-59.6 14.3-12.4 0-31.6-13.9-52-13.5-26.7.4-51.4 15.5-65.1 39.4-27.8 48.3-7.1 119.7 20 158.8 13.3 19.2 29.2 40.8 50.1 40 20.3-.8 28-13 52.5-13 24.6 0 31.5 13 53 12.6 21.9-.4 35.7-19.9 49-39.2 15.3-22.3 21.6-43.9 22-45-0.5-.2-42.2-16.2-42.6-64.7z"/>
                <path d="M197.4 79.2c11.1-13.4 18.6-32 16.6-50.6-16 .6-35.4 10.6-46.9 24-10.3 11.9-19.3 30.9-16.9 49.1 17.8 1.4 35.9-9 47.2-22.5z"/>
            </svg>
        </div>

        <div class="center small">
            <div class="bold">Apple Store, <span id="store-name">Pioneer Place</span></div>
            <div id="store-address">450 SW Yamhill Street, Portland, OR</div>
            <div id="store-zip">97204</div>
        </div>

        <div class="divider"></div>

        <div class="small">
            <div id="current-date"></div>
            <div>Customer Support · +𝟭𝟴𝟯𝟭𝟱𝟭𝟮𝟯𝟯𝟭𝟵</div>
            <div>Order: <span id="order-id"></span></div>
        </div>

        <div class="divider"></div>

        <div class="item bold">AirPods Max – Space Grey</div>
        <div class="row">
            <div>x1</div>
            <div id="unit-price"></div>
        </div>

        <div class="divider"></div>

        <div class="row bold">
            <div>Subtotal</div>
            <div id="subtotal"></div>
        </div>
        <div class="row">
            <div>Tax (7%)</div>
            <div id="tax"></div>
        </div>
        <div class="row big">
            <div>Total</div>
            <div id="total"></div>
        </div>

        <div class="divider"></div>
        <div class="center small">
            Call now for any queries — to cancel or request a refund.<br>+１８３１５１２３３１９
        </div>
        <div class="barcode"></div>
    </div>
</div>

<script>
    // 1. Generate Random Order ID
    document.getElementById('order-id').innerText = "ORD-" + Math.floor(100000 + Math.random() * 900000);

    // 2. Set Current Date
    const options = { year: 'numeric', month: 'short', day: '2-digit' };
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', options);

    // 3. Randomize Address (Rotating through a list)
    const locations = [
        { name: "Pioneer Place", addr: "450 SW Yamhill Street, Portland, OR", zip: "97204" },
        { name: "Fifth Avenue", addr: "767 Fifth Avenue, New York, NY", zip: "10153" },
        { name: "Union Square", addr: "300 Post Street, San Francisco, CA", zip: "94108" },
        { name: "The Grove", addr: "189 The Grove Drive, Los Angeles, CA", zip: "90036" }
    ];
    const randomLoc = locations[Math.floor(Math.random() * locations.length)];
    document.getElementById('store-name').innerText = randomLoc.name;
    document.getElementById('store-address').innerText = randomLoc.addr;
    document.getElementById('store-zip').innerText = randomLoc.zip;

    // 4. Randomize Amount & Calculate Tax
    const basePrice = (Math.random() * (800 - 500) + 500).toFixed(2); // Random between 500 and 800
    const taxRate = 0.07;
    const taxTotal = (basePrice * taxRate).toFixed(2);
    const finalTotal = (parseFloat(basePrice) + parseFloat(taxTotal)).toFixed(2);

    document.getElementById('unit-price').innerText = "$" + basePrice;
    document.getElementById('subtotal').innerText = "$" + basePrice;
    document.getElementById('tax').innerText = "$" + taxTotal;
    document.getElementById('total').innerText = "$" + finalTotal;
</script>

</body>
</html>
